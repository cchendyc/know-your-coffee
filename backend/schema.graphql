"An object with a globally unique ID, for client-side caching (Apollo iOS, Relay)."
interface Node {
  id: ID!
}

enum UserRole {
  USER
  "Can resolve ownership claims and override any field."
  ADMIN
}

enum ClaimStatus {
  PENDING
  APPROVED
  REJECTED
}

enum OrderStatus {
  "Auto-accepted at checkout; sellers never accept or decline."
  PLACED
  "Ship only: items boxed, label printed, not yet scanned by the carrier."
  PACKED
  SHIPPED
  DELIVERED
  "Pickup only: packed and waiting at the counter."
  READY_FOR_PICKUP
  "Pickup only: the buyer collected it."
  PICKED_UP
  CANCELED
}

enum Fulfillment {
  "Seller ships it; the order gets a shipment."
  SHIP
  "Buyer collects it at the shop; no shipment."
  PICKUP
}

enum ShipmentStatus {
  LABEL_READY
  READY_FOR_DROPOFF
  IN_TRANSIT
  DELIVERED
}

enum MachineBrand {
  LA_MARZOCCO
  SLAYER
  SYNESSO
  KEES_VAN_DER_WESTEN
  VICTORIA_ARDUINO
  NUOVA_SIMONELLI
  MODBAR
  ROCKET
  RANCILIO
  BREVILLE
  DECENT
  FAEMA
  OTHER
  UNKNOWN
}

enum BeanSource {
  "The shop roasts its own beans (roaster-retailer)."
  IN_HOUSE_ROAST
  "Wholesale account with a local or regional roaster."
  LOCAL_ROASTER
  "Wholesale account with a nationally distributed roaster."
  NATIONAL_ROASTER
  "Rotating selection from multiple roasters."
  MULTI_ROASTER
  "Roasted by a third party under the shop's own brand."
  PRIVATE_LABEL
  "Bulk pre-roasted commercial-grade coffee from a foodservice distributor."
  DISTRIBUTOR
  UNKNOWN
}

enum ReportSource {
  TEXT
  PHOTO
}

enum CoffeeType {
  SINGLE_ORIGIN
  BLEND
}

"Primary post-harvest route. Fermentation styles layer on top, see Coffee.fermentation."
enum CoffeeProcess {
  WASHED
  NATURAL
  HONEY
  WET_HULLED
  OTHER
}

enum RoastLevel {
  LIGHT
  MEDIUM
  DARK
}

"One coffee on bar. Every field is optional; report what the bag shows."
type Coffee {
  "The roaster's name for it, e.g. Urcunina."
  name: String
  "Per-coffee roaster; matters for multi-roaster shops."
  roaster: String
  type: CoffeeType
  "Origin countries; several for a blend."
  origins: [String!]!
  process: CoffeeProcess
  "Free text; techniques outpace any fixed list. E.g. Anaerobic, Koji, Lactic."
  fermentation: String
  roastLevel: RoastLevel
  "Plant varieties, e.g. Gesha, SL28, Bourbon."
  varieties: [String!]!
  tastingNotes: [String!]!
}

input CoffeeInput {
  name: String
  roaster: String
  type: CoffeeType
  origins: [String!]
  process: CoffeeProcess
  fermentation: String
  roastLevel: RoastLevel
  varieties: [String!]
  tastingNotes: [String!]
}

"What a community photo shows, so galleries can be grouped by section."
enum PhotoKind {
  MACHINE
  BEANS
  DRINKS
  MENU
  VIBE
  OTHER
}

"One espresso machine on the bar."
type Machine {
  brand: MachineBrand!
  model: String
}

input MachineInput {
  brand: MachineBrand!
  model: String
}

"A menu item, e.g. matcha latte at 6.50."
type DrinkItem {
  name: String!
  price: Float
}

input DrinkInput {
  name: String!
  price: Float
}

type CoffeeShop implements Node {
  id: ID!
  name: String!
  address: String!
  city: String!
  lat: Float!
  lng: Float!
  "The primary machine; mirrors the first machines entry."
  machine: MachineBrand!
  machineModel: String
  "All espresso machines on the bar."
  machines: [Machine!]!
  beanSource: BeanSource!
  roaster: String
  "Bean origins, e.g. Single origin, Seasonal, Ethiopia, Brazil. Superseded by coffees."
  beanOrigins: [String!]!
  "Coffees currently on bar, newest report wins."
  coffees: [Coffee!]!
  "Grinders in use, e.g. Mahlkonig EK43."
  grinders: [String!]!
  "Menu drinks with prices where known."
  drinks: [DrinkItem!]!
  "Milk brands served, e.g. Straus, Oatly."
  milkBrands: [String!]!
  "Short summary of the shop's atmosphere, extracted from public reviews."
  vibe: String
  "Null means unknown."
  dogFriendly: Boolean
  "Null means unknown."
  wifi: Boolean
  "Null means unknown."
  outdoorSeating: Boolean
  photoUrl: String
  "The shop's own website."
  website: String
  "Set when this location belongs to a multi-shop brand."
  chain: Chain
  "The verified owner's user id, set when an ownership claim is approved."
  ownerId: ID
  "The verified owner's public profile, set when an ownership claim is approved."
  owner: Reporter
  "True when the signed-in viewer is the verified owner."
  ownedByMe: Boolean!
  "True once the owner finished the seller onboarding walkthrough."
  sellerOnboarded: Boolean!
  "True when the signed-in viewer bookmarked this shop."
  savedByMe: Boolean!
  "True when the signed-in viewer marked this shop as visited."
  beenByMe: Boolean!
  "Products the shop sells online. Empty until the verified owner adds some."
  products: [Product!]!
  "How buyers can receive products: shipping, pickup, or both."
  deliverySettings: DeliverySettings!
  "Work waiting on the seller at this shop. Null unless the viewer owns it."
  workload: SellerWorkload
  "Community photos, newest first. Photos carry full image data; request only as many as you render."
  photos(limit: Int): [ShopPhoto!]!
  photoCount: Int!
  "Community reports, newest first. Reports by ADMIN users are hidden: they fold into the shop record but are data entry, not community activity."
  reports(limit: Int): [Report!]!
  "Counts the same reports the reports field returns, so it also excludes ADMIN reports."
  reportCount: Int!
  updatedAt: String!
}

"A multi-location brand. Equipment and menu stay on each CoffeeShop."
type Chain implements Node {
  id: ID!
  name: String!
  slug: String!
  website: String
  shops: [CoffeeShop!]!
}

"A page of shops plus the total match count, for offset pagination."
type ShopPage {
  shops: [CoffeeShop!]!
  total: Int!
}

"A page of a seller's listings plus the total match count, for offset pagination."
type ProductPage {
  products: [Product!]!
  total: Int!
}

"A page of a seller's orders plus the total match count, for offset pagination."
type OrderPage {
  orders: [Order!]!
  total: Int!
}

"A page of a seller's shipments plus the total match count, for offset pagination."
type ShipmentPage {
  shipments: [Shipment!]!
  total: Int!
}

"""
The signed-in viewer as a seller. One user may own any number of shops;
each shop has exactly one owner. Ownership comes from approved claims.
"""
type Seller {
  "Owned shops, by name."
  shops: [CoffeeShop!]!
  "Every owned shop's workload summed."
  workload: SellerWorkload!
}

"Counts of seller work outstanding; badges in the shop switcher and the all-shops overview."
type SellerWorkload {
  "PLACED and READY_FOR_PICKUP orders."
  toFulfill: Int!
  "Shipments not yet handed to a carrier: LABEL_READY and READY_FOR_DROPOFF."
  toShip: Int!
  "Active listings at or below their low-stock threshold."
  lowStock: Int!
}

type User implements Node {
  id: ID!
  name: String!
  "Null for phone-only accounts."
  email: String
  "E.164 phone, set for phone sign-in accounts."
  phone: String
  picture: String
  role: UserRole!
  "Shops on the viewer's saved list."
  savedCount: Int!
  "Shops on the viewer's been list."
  beenCount: Int!
}

"JSON object of category field values keyed by CategoryField.key, each typed per its valueType."
scalar JSON

enum AttributeValueType {
  TEXT
  INT
  DECIMAL
  BOOL
  "One of the field's options, sent as the option value."
  ENUM
  "Any number of the field's options, sent as a list of option values."
  ENUM_MULTI
  "Free-text list, e.g. tasting notes."
  TEXT_LIST
}

"Which card of the listing form shows a field."
enum AttributeSection {
  "Size, form, condition: what tells one option from another."
  FORMAT
  "Origin, roast, materials: what the thing is."
  DETAILS
}

"One choice of an ENUM or ENUM_MULTI field."
type AttributeOption {
  value: String!
  label: String!
}

"One field of a category's listing form, in display order."
type CategoryField {
  "Key in Product.attributes and ProductInput.attributes."
  key: String!
  label: String!
  valueType: AttributeValueType!
  "Unit for INT and DECIMAL fields, e.g. g or ml."
  unit: String
  help: String
  "Choices for ENUM and ENUM_MULTI; empty otherwise."
  options: [AttributeOption!]!
  required: Boolean!
  "Part of Product.subtitle."
  showInSubtitle: Boolean!
  section: AttributeSection!
}

"What a shop can sell: Beans, Drink, Gear, Merch. Each category has its own fields."
type Category implements Node {
  id: ID!
  slug: String!
  label: String!
  fields: [CategoryField!]!
  """
  How Product.subtitle is built, e.g. "{weight_g} {form} · {roast_level}".
  Tokens are field keys; a " · " segment whose tokens are all empty is dropped.
  Clients use it to preview the subtitle while editing.
  """
  subtitleTemplate: String
}

"Something a shop sells online, e.g. a 340 g bag of Urcunina."
type Product implements Node {
  id: ID!
  shopId: ID!
  name: String!
  categoryId: ID!
  category: Category!
  "Values for the category's fields, keyed by CategoryField.key."
  attributes: JSON!
  "One line under the name built from the category's subtitle fields, e.g. 340 g Whole bean · Light."
  subtitle: String
  description: String
  price: Float!
  quantity: Int!
  "quantity at or below this marks the product low stock."
  lowStockThreshold: Int!
  lowStock: Boolean!
  "Inactive products are hidden from buyers; order history keeps them."
  active: Boolean!
  "Listing images in display order, at most 6. Fetch per listing; each is a whole data URL."
  photos: [ProductPhoto!]!
  "The first photo, for lists and cards."
  coverPhoto: ProductPhoto
  status: ListingStatus!
  createdAt: String!
  updatedAt: String!
}

"Derived from active and stock; HIDDEN wins over stock level."
enum ListingStatus {
  IN_STOCK
  "Active with quantity at or below lowStockThreshold, including 0."
  LOW_STOCK
  HIDDEN
}

"Listing counts per status, for the Seller Hub filter chips."
type ProductCounts {
  total: Int!
  inStock: Int!
  lowStock: Int!
  hidden: Int!
}

type ProductPhoto implements Node {
  id: ID!
  "Data URL of the image."
  data: String!
  "0-based display order; 0 is the cover."
  position: Int!
}

"""
One slot in a listing's photo list. Send id to keep an existing photo in
this position, or data to upload a new one. Exactly one of the two.
"""
input ProductPhotoInput {
  id: ID
  "Data URL; clients should downscale to ~1000px before upload."
  data: String
}

"""
Shared by create and update. Create requires name, price, and categoryId
and defaults quantity 0, lowStockThreshold 5, active true. Update keeps
omitted fields. attributes always replaces the whole object and is
validated against the category's fields: unknown keys, bad option values,
and missing required fields are rejected.
"""
input ProductInput {
  name: String
  categoryId: ID
  "Category field values keyed by CategoryField.key."
  attributes: JSON
  description: String
  price: Float
  quantity: Int
  lowStockThreshold: Int
  active: Boolean
}

"Fulfillment methods a shop offers. At least one of shipping and pickup is always on."
type DeliverySettings {
  shipping: Boolean!
  pickup: Boolean!
  "Shown to pickup buyers, e.g. Ask at the register. Open 7am to 3pm."
  pickupInstructions: String
}

"Update keeps omitted fields. Turning off both shipping and pickup is rejected."
input DeliverySettingsInput {
  shipping: Boolean
  pickup: Boolean
  pickupInstructions: String
}

"Owner-editable shop profile. Empty strings clear the field."
input ShopProfileInput {
  "Shop bio shown on the shop page."
  vibe: String
  website: String
}

"A line on an order. Name and unitPrice are snapshots taken at purchase."
type OrderItem {
  productId: ID!
  name: String!
  qty: Int!
  unitPrice: Float!
}

input OrderItemInput {
  productId: ID!
  qty: Int! = 1
}

"A purchase. Auto-accepted; sellers can cancel but never accept or decline."
type Order implements Node {
  id: ID!
  "Sequential display number, e.g. 1279."
  number: Int!
  shopId: ID!
  shop: CoffeeShop!
  "Null when the buyer's account was deleted."
  buyer: Reporter
  items: [OrderItem!]!
  total: Float!
  status: OrderStatus!
  fulfillment: Fulfillment!
  "Null for pickup orders and once the order is canceled."
  shipment: Shipment
  createdAt: String!
}

"One package per order, created automatically when the order is placed."
type Shipment implements Node {
  id: ID!
  orderId: ID!
  order: Order!
  carrier: String
  tracking: String
  "ISO date the package must ship by; two days after purchase."
  shipBy: String
  status: ShipmentStatus!
  createdAt: String!
  updatedAt: String!
}

"""
A seller application: a user's request to be recognized as a shop's owner,
reviewed by support. Approval grants Seller Hub access for that shop.
"""
type ShopClaim implements Node {
  id: ID!
  shopId: ID!
  shop: CoffeeShop!
  status: ClaimStatus!
  "Applicant's role at the business, e.g. Owner, Manager."
  businessRole: String
  "Business email or phone support can use to verify."
  contact: String
  "Website or social profile that proves the affiliation."
  website: String
  "Evidence for the claim, e.g. a link or how to verify."
  note: String
  "Who applied. Null on records whose account was deleted."
  applicant: Reporter
  "Shops the applicant already owns, so support can fast-track a second location."
  applicantOwnedShops: [CoffeeShop!]!
  createdAt: String!
  resolvedAt: String
}

"Seller application details submitted with claimShop."
input SellerApplicationInput {
  "Role at the business, e.g. Owner, Manager."
  businessRole: String
  "Business email or phone for verification."
  contact: String
  "Website or social profile proving the affiliation."
  website: String
  note: String
}

type Reporter {
  name: String!
  picture: String
}

type AuthPayload {
  token: String!
  user: User!
}

type SignInCodeRequest {
  "True when the code went out by SMS or email."
  sent: Boolean!
  "Dev only: set when no SMS/email provider is configured, so local sign-in works."
  devCode: String
}

type Report implements Node {
  id: ID!
  shopId: ID!
  machine: MachineBrand
  machineModel: String
  machines: [Machine!]
  beanSource: BeanSource
  roaster: String
  beanOrigins: [String!]
  coffees: [Coffee!]
  grinders: [String!]
  drinks: [DrinkItem!]
  milkBrands: [String!]
  dogFriendly: Boolean
  wifi: Boolean
  outdoorSeating: Boolean
  note: String
  source: ReportSource!
  reporter: Reporter
  createdAt: String!
}

type ShopPhoto implements Node {
  id: ID!
  kind: PhotoKind!
  "Data URL of the image."
  data: String!
  uploader: Reporter
  createdAt: String!
}

input PhotoInput {
  kind: PhotoKind!
  "Data URL; clients should downscale to ~1000px before upload."
  data: String!
}

type MachineGuess {
  machine: MachineBrand!
  machineModel: String
  confidence: Float!
  notes: String
}

"A Google Places match while typing a shop name."
type PlaceSuggestion {
  placeId: ID!
  name: String!
  address: String!
}

"Full place details to prefill the add-shop form."
type PlacePreview {
  placeId: ID!
  name: String!
  address: String!
  city: String!
  lat: Float!
  lng: Float!
  photoUrl: String
  website: String
  "False when Google says this place is not a coffee shop; adding it is rejected."
  isCoffeeShop: Boolean!
  "The already-listed shop matching this place, if any — open it instead of creating a duplicate."
  existing: CoffeeShop
}

input ReportInput {
  shopId: ID!
  "Omit when machines is set; the primary is derived from its first entry."
  machine: MachineBrand
  machineModel: String
  machines: [MachineInput!]
  beanSource: BeanSource
  roaster: String
  beanOrigins: [String!]
  coffees: [CoffeeInput!]
  grinders: [String!]
  drinks: [DrinkInput!]
  milkBrands: [String!]
  dogFriendly: Boolean
  wifi: Boolean
  outdoorSeating: Boolean
  note: String
  source: ReportSource = TEXT
}

type Query {
  shops(
    search: String
    machine: MachineBrand
    city: String
    saved: Boolean
    been: Boolean
    limit: Int! = 24
    offset: Int! = 0
  ): ShopPage!
  shop(id: ID!): CoffeeShop
  cities: [String!]!
  me: User
  "The signed-in viewer; alias of me, named for mobile clients."
  userNode: User
  "Shops the signed-in viewer owns (approved claims)."
  myShops: [CoffeeShop!]!
  "The viewer's seller account. Null when they own no shop."
  mySeller: Seller
  "The signed-in viewer's ownership claims, newest first."
  myClaims: [ShopClaim!]!
  "Listing categories with their fields, in display order. Drives the listing form."
  categories: [Category!]!
  "One product by id. Hidden products are visible only to the shop owner."
  product(id: ID!): Product
  "A shop's products including inactive ones, oldest first. Requires shop ownership. limit is capped at 100."
  myProducts(shopId: ID!, status: ListingStatus, limit: Int! = 25, offset: Int! = 0): ProductPage!
  "Per-status listing counts. Requires shop ownership."
  myProductCounts(shopId: ID!): ProductCounts!
  "Orders for one owned shop, or for every owned shop when shopId is omitted. Newest first. limit is capped at 100."
  myOrders(shopId: ID, status: OrderStatus, limit: Int! = 25, offset: Int! = 0): OrderPage!
  "Shipments for one owned shop, or for every owned shop when shopId is omitted. Soonest ship-by first. limit is capped at 100."
  myShipments(shopId: ID, status: ShipmentStatus, limit: Int! = 25, offset: Int! = 0): ShipmentPage!
  "Orders the signed-in viewer placed as a buyer, newest first."
  myPurchases: [Order!]!
  "All unresolved claims, oldest first. Requires ADMIN."
  pendingClaims: [ShopClaim!]!
  "Type-ahead shop search on Google Places, biased to the Bay Area. Requires sign-in and GOOGLE_PLACES_API_KEY on the server."
  searchPlaces(query: String!): [PlaceSuggestion!]!
  "Details for one suggestion, including photo and website. Requires sign-in."
  placePreview(placeId: ID!): PlacePreview
}

type Mutation {
  "Exchange a Google ID token for a session token. Requires GOOGLE_OAUTH_CLIENT_ID on the server."
  signInWithGoogle(idToken: String!): AuthPayload!
  "Exchange a Sign in with Apple identity token for a session token. Pass the name Apple provides on first authorization."
  signInWithApple(identityToken: String!, name: String): AuthPayload!
  "Text a 6-digit code to a phone number. US numbers may omit the +1."
  startPhoneSignIn(phone: String!): SignInCodeRequest!
  "Exchange a phone number and its code for a session token; creates the account on first use."
  signInWithPhone(phone: String!, code: String!): AuthPayload!
  "Email a 6-digit code. Requires RESEND_API_KEY on the server (dev mode returns the code)."
  startEmailSignIn(email: String!): SignInCodeRequest!
  "Exchange an email and its code for a session token; creates or links the account."
  signInWithEmail(email: String!, code: String!): AuthPayload!
  "Add the coffee shop behind a Places suggestion. Requires sign-in and GOOGLE_PLACES_API_KEY."
  addShopFromPlace(placeId: ID!): CoffeeShop!
  "Submit a community report. Requires sign-in."
  submitReport(input: ReportInput!): Report!
  "Bookmark (saved) or mark visited (been). Omitted flags are left unchanged. Requires sign-in."
  setShopStatus(shopId: ID!, saved: Boolean, been: Boolean): CoffeeShop!
  "Attach community photos to a shop, grouped by what they show. Requires sign-in."
  addShopPhotos(shopId: ID!, photos: [PhotoInput!]!): [ShopPhoto!]!
  "Identify an espresso machine from a base64-encoded photo. Requires sign-in and GEMINI_API_KEY on the server."
  identifyMachine(imageBase64: String!): MachineGuess!
  "Extract drinks and prices from a base64-encoded menu photo. Requires sign-in and GEMINI_API_KEY on the server."
  parseMenu(imageBase64: String!): [DrinkItem!]!
  "Bulk-import coffee shops near a location from Yelp. Requires ADMIN and YELP_API_KEY on the server."
  importShopsFromYelp(location: String! = "San Francisco, CA"): [CoffeeShop!]!
  "Bulk-import coffee shops near a location from Google Places. Requires ADMIN and GOOGLE_PLACES_API_KEY on the server."
  importShopsFromGoogle(location: String! = "San Francisco, CA"): [CoffeeShop!]!
  "Apply to be a shop's seller. Existing sellers apply the same way for each additional shop. Idempotent while a claim is pending. Requires sign-in. note alone is the legacy form; prefer application."
  claimShop(shopId: ID!, note: String, application: SellerApplicationInput): ShopClaim!
  "Approve or reject a claim; approval sets the shop's owner. Requires ADMIN."
  resolveClaim(claimId: ID!, approve: Boolean!): ShopClaim!
  "Add a product to a shop's storefront. Requires shop ownership."
  createProduct(shopId: ID!, input: ProductInput!): Product!
  "Update a product; omitted input fields keep their values. Requires shop ownership."
  updateProduct(id: ID!, input: ProductInput!): Product!
  "Remove a product. Order history keeps its name snapshots. Requires shop ownership."
  deleteProduct(id: ID!): Boolean!
  "Replace a listing's photos with this ordered list (max 6, ~700KB each). Photos not listed are deleted. Requires shop ownership."
  setProductPhotos(productId: ID!, photos: [ProductPhotoInput!]!): Product!
  """
  Duplicate listings from one owned shop into another. Omit productIds to copy
  every listing. Copies keep name, category, fields, description, price,
  threshold, and photos; quantity starts at 0 and the copy is hidden until
  the seller lists it.
  Requires ownership of both shops.
  """
  copyProducts(fromShopId: ID!, toShopId: ID!, productIds: [ID!]): [Product!]!
  "Set which fulfillment methods buyers can choose. Requires shop ownership."
  updateDeliverySettings(shopId: ID!, input: DeliverySettingsInput!): CoffeeShop!
  "Owner-editable public profile. Omitted input fields keep their values. Requires shop ownership."
  updateShopProfile(shopId: ID!, input: ShopProfileInput!): CoffeeShop!
  "Record that the owner finished the seller walkthrough. Idempotent. Requires shop ownership."
  completeSellerOnboarding(shopId: ID!): CoffeeShop!
  "Buy products. Auto-accepted; SHIP also creates the shipment with a 2-day ship-by. The shop must offer the chosen fulfillment. Requires sign-in."
  placeOrder(shopId: ID!, items: [OrderItemInput!]!, fulfillment: Fulfillment = SHIP): Order!
  "Cancel a PLACED or READY_FOR_PICKUP order, restocking its items. Buyer or shop owner."
  cancelOrder(id: ID!): Order!
  "Pickup order: PLACED to READY_FOR_PICKUP. Requires shop ownership."
  markReadyForPickup(id: ID!): Order!
  "Pickup order: READY_FOR_PICKUP to PICKED_UP. Requires shop ownership."
  markPickedUp(id: ID!): Order!
  "Set carrier, tracking, or status. IN_TRANSIT marks the order SHIPPED; DELIVERED marks it DELIVERED. Requires shop ownership."
  updateShipment(id: ID!, carrier: String, tracking: String, status: ShipmentStatus): Shipment!
  "Remove a shop that is not a coffee shop. Cascades reports, photos, and claims. Requires ADMIN."
  deleteShop(id: ID!): Boolean!
  """
  Delete the signed-in user's account (App Store guideline 5.1.1(v)).
  Contributed reports and photos stay but are anonymized; saves, claims,
  and shop ownership are removed. The session token stops working.
  """
  deleteAccount: Boolean!
}
