enum MachineBrand {
  LA_MARZOCCO
  SLAYER
  SYNESSO
  KEES_VAN_DER_WESTEN
  VICTORIA_ARDUINO
  NUOVA_SIMONELLI
  MODBAR
  ROCKET
  RANCILIO
  BREVILLE
  DECENT
  OTHER
  UNKNOWN
}

enum BeanSource {
  IN_HOUSE_ROAST
  LOCAL_ROASTER
  NATIONAL_ROASTER
  MULTI_ROASTER
  UNKNOWN
}

enum ReportSource {
  TEXT
  PHOTO
}

"What a community photo shows, so galleries can be grouped by section."
enum PhotoKind {
  MACHINE
  BEANS
  DRINKS
  MENU
  VIBE
  OTHER
}

"A menu item, e.g. matcha latte at 6.50."
type DrinkItem {
  name: String!
  price: Float
}

input DrinkInput {
  name: String!
  price: Float
}

type CoffeeShop {
  id: ID!
  name: String!
  address: String!
  city: String!
  lat: Float!
  lng: Float!
  machine: MachineBrand!
  machineModel: String
  beanSource: BeanSource!
  roaster: String
  "Bean origins, e.g. Single origin, Seasonal, Ethiopia, Brazil."
  beanOrigins: [String!]!
  "Grinders in use, e.g. Mahlkonig EK43."
  grinders: [String!]!
  "Menu drinks with prices where known."
  drinks: [DrinkItem!]!
  "Milk brands served, e.g. Straus, Oatly."
  milkBrands: [String!]!
  "Short summary of the shop's atmosphere, extracted from public reviews."
  vibe: String
  "Null means unknown."
  dogFriendly: Boolean
  "Null means unknown."
  wifi: Boolean
  "Null means unknown."
  outdoorSeating: Boolean
  photoUrl: String
  "The shop's own website."
  website: String
  "Set when this location belongs to a multi-shop brand."
  chain: Chain
  "True when the signed-in viewer bookmarked this shop."
  savedByMe: Boolean!
  "True when the signed-in viewer marked this shop as visited."
  beenByMe: Boolean!
  "Community photos, newest first. Photos carry full image data; request only as many as you render."
  photos(limit: Int): [ShopPhoto!]!
  photoCount: Int!
  "Community reports, newest first."
  reports(limit: Int): [Report!]!
  reportCount: Int!
  updatedAt: String!
}

"A multi-location brand. Equipment and menu stay on each CoffeeShop."
type Chain {
  id: ID!
  name: String!
  slug: String!
  website: String
  shops: [CoffeeShop!]!
}

"A page of shops plus the total match count, for offset pagination."
type ShopPage {
  shops: [CoffeeShop!]!
  total: Int!
}

type User {
  id: ID!
  name: String!
  email: String!
  picture: String
  "Shops on the viewer's saved list."
  savedCount: Int!
  "Shops on the viewer's been list."
  beenCount: Int!
}

type Reporter {
  name: String!
  picture: String
}

type AuthPayload {
  token: String!
  user: User!
}

type Report {
  id: ID!
  shopId: ID!
  machine: MachineBrand
  machineModel: String
  beanSource: BeanSource
  roaster: String
  beanOrigins: [String!]
  grinders: [String!]
  drinks: [DrinkItem!]
  milkBrands: [String!]
  dogFriendly: Boolean
  wifi: Boolean
  outdoorSeating: Boolean
  note: String
  source: ReportSource!
  reporter: Reporter
  createdAt: String!
}

type ShopPhoto {
  id: ID!
  kind: PhotoKind!
  "Data URL of the image."
  data: String!
  uploader: Reporter
  createdAt: String!
}

input PhotoInput {
  kind: PhotoKind!
  "Data URL; clients should downscale to ~1000px before upload."
  data: String!
}

type MachineGuess {
  machine: MachineBrand!
  machineModel: String
  confidence: Float!
  notes: String
}

"A Google Places match while typing a shop name."
type PlaceSuggestion {
  placeId: ID!
  name: String!
  address: String!
}

"Full place details to prefill the add-shop form."
type PlacePreview {
  placeId: ID!
  name: String!
  address: String!
  city: String!
  lat: Float!
  lng: Float!
  photoUrl: String
  website: String
  "False when Google says this place is not a coffee shop; adding it is rejected."
  isCoffeeShop: Boolean!
  "The already-listed shop matching this place, if any — open it instead of creating a duplicate."
  existing: CoffeeShop
}

input ReportInput {
  shopId: ID!
  machine: MachineBrand
  machineModel: String
  beanSource: BeanSource
  roaster: String
  beanOrigins: [String!]
  grinders: [String!]
  drinks: [DrinkInput!]
  milkBrands: [String!]
  dogFriendly: Boolean
  wifi: Boolean
  outdoorSeating: Boolean
  note: String
  source: ReportSource = TEXT
}

type Query {
  shops(
    search: String
    machine: MachineBrand
    city: String
    saved: Boolean
    been: Boolean
    limit: Int! = 24
    offset: Int! = 0
  ): ShopPage!
  shop(id: ID!): CoffeeShop
  cities: [String!]!
  me: User
  "Type-ahead shop search on Google Places, biased to the Bay Area. Requires GOOGLE_PLACES_API_KEY on the server."
  searchPlaces(query: String!): [PlaceSuggestion!]!
  "Details for one suggestion, including photo and website."
  placePreview(placeId: ID!): PlacePreview
}

type Mutation {
  "Exchange a Google ID token for a session token. Requires GOOGLE_OAUTH_CLIENT_ID on the server."
  signInWithGoogle(idToken: String!): AuthPayload!
  "Add the coffee shop behind a Places suggestion. Requires sign-in and GOOGLE_PLACES_API_KEY."
  addShopFromPlace(placeId: ID!): CoffeeShop!
  "Submit a community report. Requires sign-in."
  submitReport(input: ReportInput!): Report!
  "Bookmark (saved) or mark visited (been). Omitted flags are left unchanged. Requires sign-in."
  setShopStatus(shopId: ID!, saved: Boolean, been: Boolean): CoffeeShop!
  "Attach community photos to a shop, grouped by what they show. Requires sign-in."
  addShopPhotos(shopId: ID!, photos: [PhotoInput!]!): [ShopPhoto!]!
  "Identify an espresso machine from a base64-encoded photo. Requires GEMINI_API_KEY on the server."
  identifyMachine(imageBase64: String!): MachineGuess!
  "Extract drinks and prices from a base64-encoded menu photo. Requires GEMINI_API_KEY on the server."
  parseMenu(imageBase64: String!): [DrinkItem!]!
  "Import coffee shops near a location from Yelp. Requires YELP_API_KEY on the server."
  importShopsFromYelp(location: String! = "San Francisco, CA"): [CoffeeShop!]!
  "Import coffee shops near a location from Google Places. Requires GOOGLE_PLACES_API_KEY on the server."
  importShopsFromGoogle(location: String! = "San Francisco, CA"): [CoffeeShop!]!
}
